<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    <style>
        body {
            background-color: #e3f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #b3e0f0;
            padding: 20px;
            border-radius: 15px;
            width: 400px;
            height: auto;
            color: #2c3e50;
        }
        .input-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 10px;
            border-radius: 5px;
            width: 70%;
            background-color: #6bb9e4;
            color: white;
            border: none;
        }
        input[type="text"]::placeholder {
            color: #2c3e50;
            opacity: 1;
        }
        button {
            padding: 10px;
            border-radius: 5px;
            background-color: #5a9bd4;
            color: white;
            border: none;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background-color: #4688b1;
        }
        .work {
            text-align: left;
            padding: 10px;
            border: 2px solid white;
            border-radius: 5px;
            margin-top: 20px;
            background-color: #b3e0f0;
            margin-bottom: 20px;
        }
        .work ul {
            list-style-type: none;
            padding-left: 0;
        }
        .work li {
            margin-bottom: 12px;
        }
        input[type="checkbox"] {
            margin-right: 10px;
        }
        .empty-space {
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MY TODO LIST</h1>
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Enter your task" disabled>
            <button disabled>Add</button>
        </div>
        <div class="work">
            <h2>My Tasks</h2>
            <ul id="taskList">
                <li><input type="checkbox"> Buy tomatoes</li>
                <li><input type="checkbox"> Pick kids from school</li>
                <li><input type="checkbox"> Wash dishes</li>
            </ul>
            <div class="empty-space"></div>
        </div>
        <p><strong>Completed: 0</strong> | <strong>Incompleted: 0</strong></p>
    </div>
</body>
</html>
