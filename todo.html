<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>TASK 2</title>
</head>

<body class="bg-[#f0f4f8] font-sans text-gray-800 flex justify-center items-center h-screen m-0">
  <div class="bg-[#ffffff] border-2 border-[#cfd8dc] rounded-lg text-center w-[400px] p-8 shadow-md">
    <h1 class="text-2xl mb-4 text-[#3f51b5]">MY TODO LIST</h1>

    <div id="taskContainer" class="myTask">
      <div class="flex justify-center items-center mb-4 mt-4">
        <input type="text" id="taskInput" class="taskName bg-[#e8f5e9] mr-2 border-none p-2.5 rounded-md text-gray-800 placeholder-gray-600" placeholder="Enter your text">
        <button class="bg-[#4caf50] text-white px-4 py-2 rounded-md hover:bg-[#388e3c] transition ease-in-out duration-300" onclick="addTask()">Add</button>
      </div>
      <strong><u>My Tasks</u></strong><br>
      <div id="taskList">
        <input type="checkbox"> Buy tomatoes<br>
        <input type="checkbox"> Pick kids from school<br>
        <input type="checkbox"> Wash dishes
      </div>
      <div class="mt-4 text-sm text-gray-600" id="taskCount">Completed: 0 || Uncompleted: 0</div>
    </div>
  </div>
  <script>
    function addTask() {
      const input = document.getElementById('taskInput');
      const taskList = document.getElementById('taskList');

      if (!input.value) return;

      const taskItem = document.createElement('div');
      taskItem.className = 'flex justify-between items-center p-3 bg-[#e3f2fd] rounded-lg mb-2';

      taskItem.innerHTML = `
        <div class="flex items-center">
          <input type="checkbox" onchange="updateCount()">
          <span class="ml-3 text-gray-800">${input.value}</span>
        </div>
      `;

      const removeButton = document.createElement('button');
      removeButton.className = 'bg-[#f44336] text-white rounded-md px-3 py-1 ml-4 hover:bg-[#d32f2f]';
      removeButton.textContent = 'Remove';

      removeButton.onclick = function() {
        taskItem.remove();
        updateCount();
      };

      taskItem.appendChild(removeButton);
      taskList.appendChild(taskItem);

      input.value = "";
      updateCount();
    }

    function updateCount() {
      const total = document.querySelectorAll('#taskList > div').length;
      const completed = document.querySelectorAll('#taskList input:checked').length;
      const uncompleted = total - completed;
      document.getElementById('taskCount').innerText = `Completed: ${completed} || Uncompleted: ${uncompleted}`;
    }

    updateCount();
  </script>
</body>

</html>
